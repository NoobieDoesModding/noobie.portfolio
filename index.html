<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of NoobieDoesModding showcasing Wii U related projects and software work."
    />
    <title>NoobieDoesModding | Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main id="top" class="container main-minimal">
        <section class="profile-card">
          <div class="avatar-wrap">
            <img
              id="profile-image"
              src="https://github.com/NoobieDoesModding.png"
              alt="NoobieDoesModding GitHub profile picture"
              class="profile-image"
            />
          </div>

          <div class="identity-block">
            <h1 id="profile-name">NoobieDoesModding</h1>
            <p id="profile-bio" class="subtitle">
              Hey it’s me noobie! Your favorite Protarium Dev. I build Wii U tools, software, and community projects.
            </p>
            <div class="gh-meta" aria-label="GitHub profile details">
              <span id="github-followers">1 follower</span>
              <span id="github-following">3 following</span>
              <span id="github-location">France</span>
            </div>
            <div class="action-row" aria-label="Profile links">
              <a href="https://github.com/NoobieDoesModding" target="_blank" rel="noreferrer">GitHub</a>
              <a href="https://github.com/Protarium-Network" target="_blank" rel="noreferrer">Protarium</a>
              <a href="https://github.com/NoobieDoesModding/WiiUBootEditor" target="_blank" rel="noreferrer">Projects</a>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
